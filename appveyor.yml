version: 0.8.0.{build}
skip_tags: true
max_jobs: 1
image: Visual Studio 2022
configuration: Release
platform: Any CPU
force_https_clone: true
nuget:
  account_feed: false
  project_feed: false
environment:
  NUGET_HOST: https://www.nuget.org
  NUGET_APIKEY: 
    secure: GmL+s4FAMc4kMD/O+LST8XV2QXxjvpjV0muni1WttUxjwaQRXDwyXDRHpE3RvEl5
  GITHUB_TOKEN:
    secure: 3LEGKXlnbB3JnFAV6JS8iVViWj2moI0xpAN0QKHJufX3On+zvOuK1LtsBSbDd15E
build: off
build_script:
- ps: >-
    dotnet build .\Vivet.AI
artifacts:
- path: '**\*.nupkg'
  name: NuGet Package
- path: '**\*.snupkg'
  name: NuGet Symbol Package
deploy:
- provider: NuGet
  server: $(NUGET_HOST)
  api_key: $(NUGET_APIKEY)
  on:
    branch: master
- provider: GitHub
  auth_token: $(GITHUB_TOKEN)
  owner: vivet
  repo: Vivet.AI
  tag: 'v{version}'
  name: 'Vivet.AI {version}'
  message: 'Release of Vivet.AI version {version}'
  assets:
    - path: '**\*.nupkg'
    - path: '**\*.snupkg'
  draft: false
  prerelease: true
  on:
    branch: master